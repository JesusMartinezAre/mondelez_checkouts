; Proyecto: iluminación de mueble con tira WS2815B (7 LEDs) + Arduino Nano
;
; Board:
;   nanoatmega328     -> Nano con bootloader VIEJO (57600 baudios). Típico en clones con CH340.
;   nanoatmega328new  -> Nano con bootloader NUEVO / Optiboot (115200 baudios). Nanos originales recientes.
; Si la subida falla con "stk500_getsync(): not in sync", cambia al otro entorno:
;   pio run -e nano_old -t upload

[platformio]
default_envs = nano_new   ; tu NANO-V3 (FTDI FT232R) usa el bootloader NUEVO (verificado al subir)

[env]
platform = atmelavr
framework = arduino
lib_deps = fastled/FastLED@3.7.0
monitor_speed = 9600

; Bootloader viejo ("ATmega328P (Old Bootloader)" en Arduino IDE)
[env:nano_old]
board = nanoatmega328

; Bootloader nuevo ("ATmega328P" en Arduino IDE)
[env:nano_new]
board = nanoatmega328new
